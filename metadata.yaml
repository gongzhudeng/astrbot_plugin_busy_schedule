name: astrbot_plugin_busy_schedule
display_name: 灵犀 · AI忙碌时段管理
desc: >
  让AI拥有真实的生活节奏！自动计算忙碌时段、智能拦截合并消息、
  提前通知、特殊关键词唤醒，打造拟人化聊天体验。
version: v2.14.3
author: 灵犀
repo: https://github.com/gongzhudeng/astrbot_plugin_busy_schedule
help: |
  v2.14.3：修正模型输出解析失败时，同一次修正内带着原任务与严格格式要求当场重问（默认 1 次，correction_parse_repair_attempts 可调 0-3），不再让一次格式失误报废当天修正；
  v2.14.1：日程修正新增穿搭规则——set_outfit 仅在用户明确要求改穿搭时使用，小怡因活动需要临时调整穿着时直接写进活动描述，不动今日穿搭字段；
  v2.14.0：日程生成上下文换血——新增待关注事项（内心世界约定，持久不丢）与近期记忆注入（自动排除零点整合的长期摘要），知识库/记忆检索默认关闭；
  v2.13.0：新增每日定时「日程修正」——在配置的时间点用实时心情、待关注事项（用户聊天中的约定与要求）和长期记忆新条目微调当日剩余日程，无异常则不动；
  v2.12.4：日程生成优先采纳近期对话中达成的约定（穿搭风格可被对话覆盖），提示词不再注入随机心情色彩词；
  v2.12.3：向下游插件正式导出今日穿搭与发型 facts，支持 AI 生图联动；
  v2.12.2：补充日程编辑工具对降雨时段影响的提醒；
  v2.12.1：为 skills_like 模式分层日程编辑工具说明，执行与确认规则延迟到参数 schema；
  v2.12.0：日程与状态图片全新“暮紫玻璃”设计（明暗双主题、毛玻璃质感）；日程卡按内容自适应高度、长活动自动换行，穿搭卡片随条目数量伸缩，统计条实时汇总时段数据；
  v2.11.1：修复“忙碌日程”图片中主要降水时段文字溢出天气卡片的问题，支持按时间段折行与垂直居中（白天/夜间模式均生效）；
  降水摘要去掉当天冗余日期前缀，显示更简洁。
credits: |
  日程生成功能基于 astrbot_plugin_life_scheduler 改编
  原作者：木友知 (muyouzhi6)
  原项目：https://github.com/muyouzhi6/astrbot_plugin_life_scheduler
