name: astrbot_plugin_busy_schedule
display_name: 灵犀 · AI忙碌时段管理
desc: >
  让AI拥有真实的生活节奏！自动计算忙碌时段、智能拦截合并消息、
  提前通知、特殊关键词唤醒，打造拟人化聊天体验。
version: v2.11.0
author: 灵犀
repo: https://github.com/gongzhudeng/astrbot_plugin_busy_schedule
help: |
  v2.11.0：特别日规则支持四种匹配方式（只此一天/每年或每月/农历每年/每周多选），星期可多选；
  新增「作息制度」板块，生成日程时让 AI 知道用户当天上班还是休息（大小周按基准周六推算）。
credits: |
  日程生成功能基于 astrbot_plugin_life_scheduler 改编
